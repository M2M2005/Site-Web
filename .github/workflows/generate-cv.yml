name: Generate CV PDF

on:
  push:
    paths:
      - 'scripts/generate-cv.js'
    branches:
      - master

permissions:
  contents: write

jobs:
  generate-cv:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate CV PDF
        run: npm run generate-cv

      - name: Commit and push PDF
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add public/docs/CV_Cyprien_Bons_FR.pdf public/docs/CV_Cyprien_Bons_EN.pdf
          git diff --staged --quiet || git commit -m "Auto-generate CV PDF"
          git push
